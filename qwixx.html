const localSheet=()=>({marks:{red:[],yellow:[],green:[],blue:[]},penalties:0});
function newLocalGame(){return{phase:'waiting',turn:0,round:0,stage:'shared',dice:null,rows:{red:false,yellow:false,green:false,blue:false},sheets:Array.from({length:3},localSheet),bots:[true,true,true],turnMarks:[0,0,0],scores:[0,0,0],prompt:'Choose Daryl, Cristi, or Cindy to take a seat.'}}
const die=()=>1+Math.floor(Math.random()*6);
function updateScores(){data.scores=data.sheets.map(s=>COLORS.reduce((total,color)=>total+score(s.marks[color].length+(s.marks[color].includes(10)&&data.rows[color]?1:0)),0)-s.penalties*5)}
function available(who,color,index){if(!COLORS.includes(color)||data.rows[color]||index<0)return false;const marks=data.sheets[who].marks[color],high=marks.length?Math.max(...marks):-1;return !marks.includes(index)&&index>high&&(index!==10||marks.length>=5)}
function place(who,color,value){const index=vals(color).indexOf(value);if(!available(who,color,index))throw Error('That box is not available.');data.sheets[who].marks[color].push(index);data.turnMarks[who]++;if(index===10&&data.stage==='color'){data.rows[color]=true;data.prompt=`${NAMES[who]} locked the ${color} row!`}updateScores()}
function rollLocal(){data.dice={white:[die(),die()],red:die(),yellow:die(),green:die(),blue:die()};data.stage='shared';data.round++;data.turnMarks=[0,0,0];data.prompt=`${NAMES[data.turn]} rolled the dice. Everyone may use the white total.`;const total=data.dice.white[0]+data.dice.white[1];data.bots.forEach((bot,who)=>{if(!bot)return;const best=COLORS.map(color=>({color,index:vals(color).indexOf(total)})).filter(x=>available(who,x.color,x.index)).sort((a,b)=>b.index-a.index)[0];if(best)place(who,best.color,total)});updateScores()}
function finishLocal(){const who=data.turn;if(!data.turnMarks[who])data.sheets[who].penalties++;if(data.sheets[who].penalties>=4||COLORS.filter(color=>data.rows[color]).length>=2){data.phase='gameover';data.prompt='Game complete — highest score wins.';updateScores();return}data.turn=(who+1)%3;rollLocal()}
function saveLocal(){localStorage.setItem('qwixxStaticState',JSON.stringify({data,seat}))}
async function api(url,opt={}){const body=opt.body?JSON.parse(opt.body):{};if(url.includes('/join')){seat=NAMES.indexOf(body.name);if(seat<0)throw Error('Choose a listed player.');token='local';data=newLocalGame();data.bots[seat]=false;saveLocal();return{token,seat,name:NAMES[seat],state:data}}if(url.includes('/state'))return{state:data};if(!url.includes('/action'))throw Error('Unknown action.');if(body.action==='start'||body.action==='newGame'){const bots=data?.bots||NAMES.map((_,i)=>i!==seat);data=newLocalGame();data.bots=bots;data.phase='playing';data.turn=seat;rollLocal()}else if(body.action==='markShared'){if(data.stage!=='shared')throw Error('The shared action has ended.');place(seat,body.color,data.dice.white[0]+data.dice.white[1])}else if(body.action==='continue'){if(data.stage!=='shared')throw Error('The shared action has ended.');COLORS.forEach(color=>{if(data.sheets.some(s=>s.marks[color].includes(10)))data.rows[color]=true});if(COLORS.filter(color=>data.rows[color]).length>=2){data.phase='gameover';data.prompt='Two color rows are locked — game complete.'}else{data.stage='color';data.prompt=`${NAMES[data.turn]} may combine one white die with one colored die.`;if(data.bots[data.turn]){let best=null;COLORS.forEach(color=>data.dice.white.forEach(white=>{const index=vals(color).indexOf(white+data.dice[color]);if(available(data.turn,color,index)&&(!best||index>best.index))best={color,white,index}}));if(best)place(data.turn,best.color,best.white+data.dice[best.color])}}}else if(body.action==='markColor'){if(data.turn!==seat||data.stage!=='color')throw Error('That is not your colored action.');place(seat,body.color,Number(body.white)+data.dice[body.color])}else if(body.action==='end'){if(data.stage!=='color')throw Error('Finish the colored action first.');finishLocal()}updateScores();saveLocal();return{state:data}}
function modal(html){$('#modalContent').innerHTML=html;$('#modal').hidden=false}function close(){$('#modal').hidden=true}
function choose(){modal(`<h2>Choose Your Player</h2><p>Pick a seat at the table. Unclaimed players will be guided by the game.</p><div class="join">${NAMES.map(name=>`<button data-name="${name}">${name}<br><span class="tag">Join this seat</span></button>`).join('')}</div>`);document.querySelectorAll('[data-name]').forEach(button=>button.onclick=async()=>{try{const r=await api('/api/join',{method:'POST',body:JSON.stringify({name:button.dataset.name})});token=r.token;seat=r.seat;data=r.state;close();render()}catch(error){alert(error.message)}})}
function isAvailable(s,c,i){if(s.marks[c].includes(i)||data.rows[c])return false;const high=s.marks[c].length?Math.max(...s.marks[c]):-1;return i>high&&(i!==10||s.marks[c].length>=5)}

function row(s,c){const m=s.marks[c],high=m.length?Math.max(...m):-1;return `<div class="row ${c}"><span class="row-label">${c}</span>${vals(c).map((n,i)=>{const marked=m.includes(i),past=i<high&&!marked;const allow=(canShared()&&isAvailable(s,c,i)&&n===data.dice.white[0]+data.dice.white[1])||(canColor()&&isAvailable(s,c,i)&&data.dice.white.some(w=>w+data.dice[c]===n));return `<button class="box ${marked?'marked':past?'past':''}" data-c="${c}" data-i="${i}" ${allow?'':'disabled'}>${marked?'×':n}</button>`}).join('')}<span class="lock ${data.rows[c]?'done':''}">${data.rows[c]?'×':'▣'}</span></div>`}
function controls(){if(data.phase==='waiting')return `<button class="btn primary" id="start">Start Qwixx</button>`;if(data.phase==='gameover')return `<button class="btn primary" id="start">Play Again</button>`;if(data.stage==='shared')return `<button class="btn primary" id="continue">${data.turn===seat?'Continue to colored dice →':`Let ${NAMES[data.turn]} continue →`}</button>`;if(data.stage==='color')return `<button class="btn primary" id="end">${data.turn===seat?'End turn':`Finish ${NAMES[data.turn]}'s turn`}</button>`;return ''}
function bind(){document.querySelectorAll('.box:not(:disabled)').forEach(b=>b.onclick=()=>{const c=b.dataset.c,i=+b.dataset.i;if(canShared())send({action:'markShared',color:c});else if(canColor()){const n=vals(c)[i],w=data.dice.white.find(x=>x+data.dice[c]===n);send({action:'markColor',color:c,white:w})}});$('#start')&&( $('#start').onclick=()=>send({action:data.phase==='waiting'?'start':'newGame'}));$('#continue')&&($('#continue').onclick=()=>send({action:'continue'}));$('#end')&&($('#end').onclick=()=>send({action:'end'}));}
async function send(body){try{const r=await api('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,token})});data=r.state;render()}catch(e){$('#notice').textContent=e.message;setTimeout(()=>$('#notice').textContent='',2500)}}function startPoll(){clearInterval(poll);poll=setInterval(async()=>{try{data=(await api('/api/state?token='+encodeURIComponent(token))).state;render()}catch{}},700)}
$('#rules').onclick=()=>modal(`<h2>How to Play</h2><ol class="rules"><li>The active player rolls two white and four colored dice.</li><li>Everyone may mark the white-dice total in one color row.</li><li>Only the active player may then combine one white die with one colored die, marking that color.</li><li>Each row goes left to right—skipped boxes are gone forever.</li><li>To take the far-right number, have five earlier marks; it locks the row and counts as one extra mark.</li><li>If the active player marks nothing, they take a −5 penalty. The game ends at two locks or a fourth penalty.</li><li>Each row scores 1, 3, 6, 10… points for its marks. Highest total wins.</li></ol><button class="btn primary" id="close">Got it</button>`);$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};document.addEventListener('click',e=>{if(e.target.id==='close')close()});$('#new').onclick=()=>token?send({action:'newGame'}):choose();const saved=JSON.parse(localStorage.qwixxStaticState||'null');if(saved?.data&&Number.isInteger(saved.seat)){token='local';seat=saved.seat;data=saved.data;localScores();render()}else choose();
